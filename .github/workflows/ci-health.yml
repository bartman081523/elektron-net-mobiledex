# Keeps an eye on the CI of the fork's repos: every six hours (and on demand)
# it looks at the newest completed run per workflow and fails when a default
# branch ended red, so a broken branch does not go unnoticed between pushes.
name: ci-health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Scan the fork's workflows
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          python3 .github/scripts/ci-health.py > report.txt
          rc=$?
          cat report.txt
          { echo "### CI health"; echo; grep '^|' report.txt; } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update the health issue
        if: steps.scan.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body=$(printf 'The newest run of at least one default-branch workflow ended red.\n\n%s\n' "$(grep '^|' report.txt)")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --search 'CI health in:title' --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "CI health: a default-branch workflow is red" --body "$body"
          fi
          exit 1
